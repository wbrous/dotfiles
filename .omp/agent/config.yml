autolearn:
  autoContinue: false
  enabled: false
browser:
  headless: false
colorBlindMode: false
compaction:
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - soft
    - shake
composer:
  shape: pi
defaultThinkingLevel: auto
dev:
  autoqa: true
  autoqaConsent: granted
display:
  cacheMissMarker: true
  shimmer: kitt
  showTokenUsage: true
  showTurnTime: true
  smoothStreaming: true
externalThinking: false
github:
  enabled: true
memory:
  backend: 'off'
modelRoles:
  advisor: anthropic/claude-opus-5-5:high
  commit: opencode-go/muse-spark-1.3-contributor:high
  default: anthropic/claude-sonnet-5-5:medium
  designer: anthropic/claude-sonnet-5-5:high
  image: google-antigravity/gemini-3-pro-image
  plan: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-opus-5-5:medium
  smol: opencode-go/muse-spark-1.3-contributor:high
  task: opencode-go/muse-spark-1.3-contributor:high
  tiny: opencode-go/muse-spark-1.3-contributor:high
  vision: anthropic/claude-opus-5-5:medium
  judge: opencode-zen/jev-1.13-free
  web: web/parallel
  reviewer: opencode-go/muse-spark-1.3-contributor:max
  widget: opencode-go/muse-spark-1.3-contributor:high
  memory: opencode-go/muse-spark-1.3-contributor:max
  dictation: local/parakeet-tdt-0.6b-v3
task:
  agentModelOverrides:
    reviewer: '@reviewer'
personality: pragmatic
retry:
  fallbackChains:
    anthropic/*:
      - opencode-go/muse-spark-1.3-contributor:max
  waitForUsageReset: true
secrets:
  enabled: false
security:
  enabled: true
setupVersion: 3
steeringMode: all
symbolPreset: nerd
theme:
  dark: omarchy
  light: omarchy
claudeResets:
  autoRedeem5h: 'no'
  autoRedeemWeekly: 'no'
update:
  auto: true
cycleOrder:
  - smol
  - default
  - slow
statusLine:
  preset: custom
  showHookStatus: false
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - path
    - git
    - pr
    - context_pct
    - cost
    - status
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
