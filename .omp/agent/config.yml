symbolPreset: nerd
theme:
  dark: omarchy
  light: omarchy
setupVersion: 2
modelRoles:
  plan: anthropic/claude-sonnet-5-5:high
  tiny: opencode-go/muse-spark-1.3-contributor:high
  slow: anthropic/claude-sonnet-5-5:high
  default: anthropic/claude-sonnet-5-5:medium
  smol: opencode-go/muse-spark-1.3-contributor
  vision: anthropic/claude-opus-5-5:medium
  designer: anthropic/claude-sonnet-5-5:high
  advisor: anthropic/claude-opus-5-5:high
  commit: opencode-go/muse-spark-1.3-contributor:high
  task: opencode-go/muse-spark-1.3-contributor:high
  image: google-antigravity/gemini-3-pro-image
defaultThinkingLevel: auto
retry:
  fallbackChains: {}
  waitForUsageReset: true
externalThinking: true
personality: pragmatic
steeringMode: all
autolearn:
  enabled: true
  autoContinue: true
memory:
  backend: 'off'
github:
  enabled: true
composer:
  shape: pi
secrets:
  enabled: false
colorBlindMode: false
display:
  smoothStreaming: true
  cacheMissMarker: true
  showTurnTime: true
  showTokenUsage: true
  shimmer: kitt
browser:
  headless: false
compaction:
  methodOrder:
    - snapcompact
    - remote
    - handoff
    - soft
    - shake
dev:
  autoqa: true
