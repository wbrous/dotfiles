# >>> herdr kimi integration
[[hooks]]
event = "SessionStart"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' session"
timeout = 10

[[hooks]]
event = "UserPromptSubmit"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^(?!AskUserQuestion$).*$"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "PreToolUse"
matcher = "^AskUserQuestion$"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' blocked"
timeout = 10

[[hooks]]
event = "PostToolUse"
matcher = "^AskUserQuestion$"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "PostToolUseFailure"
matcher = "^AskUserQuestion$"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "SubagentStart"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "PreCompact"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "PermissionRequest"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' blocked"
timeout = 10

[[hooks]]
event = "PermissionResult"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' working"
timeout = 10

[[hooks]]
event = "Stop"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' idle"
timeout = 10

[[hooks]]
event = "Interrupt"
command = "bash '/home/wils/.kimi-code/hooks/herdr-agent-state.sh' idle"
timeout = 10

# <<< herdr kimi integration
